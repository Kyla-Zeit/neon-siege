<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080a12"/><stop offset="1" stop-color="#121424"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3cbfff" stroke-opacity=".14" stroke-width="1"/></pattern>
    <filter id="g"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="675" rx="20" fill="url(#bg)"/><rect width="1200" height="675" rx="20" fill="url(#grid)"/>
  <rect x="404" y="22" width="392" height="38" rx="8" fill="#000" opacity=".58"/>
  <text x="600" y="48" text-anchor="middle" fill="#00ffff" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Boss wave 5 incoming.</text>

  <g font-family="Segoe UI,Arial,sans-serif" fill="#fff">
    <text x="24" y="34" font-size="18" font-weight="700">Score: 2275</text><text x="24" y="62" font-size="18" font-weight="700">Wave: 5</text><text x="24" y="90" font-size="18" font-weight="700">Time: 69.3s</text><text x="24" y="118" font-size="18" font-weight="700">Kills: 41</text>
    <rect x="24" y="136" width="260" height="18" fill="#fff" opacity=".14"/><rect x="24" y="136" width="176" height="18" fill="#00ffaa"/><rect x="24" y="136" width="260" height="18" fill="none" stroke="#fff"/><text x="32" y="151" font-size="13" font-weight="700">HP 68/100</text>
    <text x="930" y="34" font-size="17" font-weight="700" fill="#ffd700">Rapid Fire: OFF</text><text x="930" y="62" font-size="17" font-weight="700" fill="#ff69b4">Spread: +2 permanent</text><text x="930" y="90" font-size="17" font-weight="700" fill="#9370db">Pierce: 6.8s</text><text x="930" y="118" font-size="17" font-weight="700" fill="#00ffff">Dash: 0.4s</text><text x="930" y="146" font-size="17" font-weight="700" fill="#00ffff">Shield: 2</text>
  </g>

  <!-- boss -->
  <circle cx="810" cy="330" r="82" fill="#ff0000" opacity=".12" filter="url(#g)"/><circle cx="810" cy="330" r="58" fill="#ff1f32"/>
  <circle cx="792" cy="317" r="5" fill="#fff"/><circle cx="828" cy="317" r="5" fill="#fff"/>
  <rect x="750" y="245" width="120" height="9" fill="#fff" opacity=".20"/><rect x="750" y="245" width="86" height="9" fill="#ff1f32"/><rect x="750" y="245" width="120" height="9" fill="none" stroke="#fff"/>

  <!-- boss spread -->
  <g fill="#ff1f32"><circle cx="735" cy="355" r="9"/><circle cx="708" cy="385" r="9"/><circle cx="693" cy="423" r="9"/><circle cx="707" cy="462" r="9"/><circle cx="736" cy="492" r="9"/></g>

  <!-- player -->
  <circle cx="410" cy="390" r="45" fill="#00ffff" opacity=".11" filter="url(#g)"/><circle cx="410" cy="390" r="22" fill="#00ffff"/><circle cx="410" cy="390" r="31" fill="none" stroke="#00ffff" stroke-width="3"/><line x1="410" y1="390" x2="448" y2="377" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <!-- piercing shots -->
  <g fill="#9370db"><circle cx="485" cy="365" r="7"/><circle cx="535" cy="350" r="7"/><circle cx="585" cy="339" r="7"/><circle cx="635" cy="331" r="7"/><circle cx="685" cy="326" r="7"/></g>

  <!-- power-ups dropped around arena -->
  <g font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle">
    <circle cx="300" cy="520" r="18" fill="none" stroke="#00bfff" stroke-width="3"/><text x="300" y="525" fill="#00bfff">B</text>
    <circle cx="520" cy="540" r="18" fill="none" stroke="#ffd700" stroke-width="3"/><text x="520" y="545" fill="#ffd700">R</text>
    <circle cx="930" cy="500" r="18" fill="none" stroke="#00ffff" stroke-width="3"/><text x="930" y="505" fill="#00ffff">C</text>
  </g>

  <text x="600" y="610" text-anchor="middle" fill="#ffd700" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Permanent upgrades stack with temporary power-ups</text>
  <text x="600" y="642" text-anchor="middle" fill="#f5f7fa" font-family="Segoe UI,Arial,sans-serif" font-size="15">Every 5th wave: boss spawn • spread projectiles • boosted health • triple power-up drop on kill</text>
</svg>